[project]
name = "audio-transcriber"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.5.4",
    "pyqt6>=6.12.0",
    "soundfile>=0.14.0",
]

[project.scripts]
audio-transcriber = "audio_transcriber:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
