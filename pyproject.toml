[project]
name = "audio-transcriber"
version = "0.2.0"
description = "Live transcript of any audio playing on an Ubuntu desktop"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.5.4",
    "pyqt6>=6.12.0",
]

[project.scripts]
audio-transcriber = "audio_transcriber.main:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
